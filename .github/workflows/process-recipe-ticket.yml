# Zero-touch ticket processing: when a recipe submission issue is opened,
# Claude (via the Agent SDK) transcribes it and opens a PR. The maintainer
# reviews the PR against the photo and merges; the site rebuilds from main.
#
# Auth: workload identity federation — the runner's GitHub OIDC token is
# exchanged for a short-lived Anthropic access token (console: Settings →
# Workload identities). No API-key secret exists in this repo; requires
# the id-token: write permission.
#
# Cost/abuse note: this runs on every issue whose title starts with
# "Recipe", filed by anyone, and each run spends API credits (capped by
# max_turns in tools/process_ticket.py). To require maintainer approval
# instead, change the trigger to `types: [labeled]` and the condition to
# `github.event.label.name == 'approved'`.
#
# Re-run for an existing issue: Actions → this workflow → Run workflow,
# with the issue number.

name: Process recipe ticket

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true

jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Recipe')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange OIDC token for Anthropic access token
        run: |
          jq -n --arg assertion "$JWT" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: $assertion,
            federation_rule_id: "fdrl_01KGQhfkKwrrBQM55zGotLAj",
            organization_id: "bfc21dc6-3d84-4ddc-b662-ed95dcf24439",
            service_account_id: "svac_01VySzw8MySChHsR8ntt2K3f",
            workspace_id: "wrkspc_01RWte352tpbTEKTZg8fPoXr"
          }' > /tmp/exchange.json
          resp=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @/tmp/exchange.json)
          tok=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$tok" ]; then
            echo "Token exchange failed:"
            echo "$resp" | jq 'with_entries(if (.key|test("token$")) then .value="<redacted>" else . end)'
            exit 1
          fi
          echo "::add-mask::$tok"
          echo "ANTHROPIC_AUTH_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Install Claude Code CLI and Agent SDK
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --quiet claude-agent-sdk anyio

      - name: Process ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/process_ticket.py "$ISSUE"
